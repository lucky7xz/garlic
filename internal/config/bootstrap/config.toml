#theme = "dracula"
#theme = "dracula2"
theme = "jade"
#theme = "nord"
#theme = "everforest"
#theme = "orasaka"

# ┌─ Async Apps ─────────────────────────────────────────────────────────────┐
# │ Applications that should launch in the background (detached from the terminal).
# │ WARNING: Do NOT add TUI/terminal apps (like vim, micro, or glow) to this list! 
# │ They require a terminal to draw their interface and will fail or glitch if run asynchronously.
# └──────────────────────────────────────────────────────────────────────────┘
async_apps = ["xdg-open", "open", "dolphin", "gedit", "code", "nautilus", "thunar", "kate"]

# ┌─ Editor ─────────────────────────────────────────────────────────────────┐
# │ Text editor to use when opening files (overridden by $EDITOR)
# └──────────────────────────────────────────────────────────────────────────┘
editor = "micro"

# ┌─ Alternative Editor ─────────────────────────────────────────────────────┐
# │ Alternative editor (e.g. use alt+enter to open)
# └──────────────────────────────────────────────────────────────────────────┘
alt_editor = "glow -p"

# ┌─ File Manager ───────────────────────────────────────────────────────────┐
# │ File manager to use when opening resource directories 'r' (overridden by $FILEMANAGER)
# └──────────────────────────────────────────────────────────────────────────┘
file_manager = "yazi"

# ┌─ Alternative File Manager ───────────────────────────────────────────────┐
# │ Alternative file manager (e.g. use alt+r to open)
# └──────────────────────────────────────────────────────────────────────────┘
alt_file_manager = "dolphin"

# ┌─ Alt Modifier ───────────────────────────────────────────────────────────┐
# │ Modifier key for alternative commands (e.g., "alt", "ctrl")
# │
# │ Note: this does not affect jumping to a workspace by number. alt+1..9 is
# │ always bound, because terminals cannot transmit ctrl+<digit> as a distinct
# │ key. If you set this to something other than "alt", that modifier is
# │ accepted for numbers too where the terminal supports it -- alt+1..9 keeps
# │ working either way. Numbering follows load order: every [[full-bulb]]
# │ first, then every [[semi-bulb]], matching the [n/m] counter in the header.
# └──────────────────────────────────────────────────────────────────────────┘
alt_modifier = "alt"

# ┌─ Full Bulb ──────────────────────────────────────────────────────────────┐
# │ Scans all level 1 child directories and uses them as categories regardless of emptiness
# └──────────────────────────────────────────────────────────────────────────┘
[[full-bulb]]
path = "~/shara/epics"
statuses = ["inProgress", "onHold", "toDo"]

# ┌─ Semi Bulb ──────────────────────────────────────────────────────────────┐
# │ Scans all level 1 child directories but ONLY displays them if they contain a `.clove.md`
# │
# │ A semi bulb's folder IS the project: the `.clove.md` marks it as in play,
# │ and the whole folder travels when you plant or harvest it. Use `ignore` to
# │ keep build output and dependencies out of the transfer. `.git` is always
# │ excluded and cannot be included -- rsync merges without deleting, so a
# │ harvested refs/ or index would leave your repo pointing at the wrong commits.
# └──────────────────────────────────────────────────────────────────────────┘
[[semi-bulb]]
path = "~/shara/scripts"
statuses = ["inProgress", "onHold"]
ignore = ["dist", "node_modules", "target", ".venv"]

[[semi-bulb]]
path = "~/shara/decks"
statuses = ["inProgress", "onHold"]

# ┌─ Remote ─────────────────────────────────────────────────────────────────┐
# │ Another machine you hand work to. Garlic plants to it, harvests from it,
# │ and can wipe it — the remote is disposable; this machine is the source.
# │
# │   garlic plant   epics                 @ agent
# │   garlic plant   scripts/drako         @ agent
# │   garlic harvest epics/fitness/running @ agent
# │   garlic status                        @ agent
# │   garlic wipe                          @ agent   (only what garlic planted)
# │   garlic wipe --all                    @ agent   (everything under root)
# │
# │ Press `c` on the board to see what is planted where. Nothing is cached:
# │ garlic asks the remote, and the answer lives until you quit.
# │
# │ Needs ssh, rsync and sha256sum on both ends. Garlic does not have to be
# │ installed over there: it only ever writes a plain tree inside `root`.
# │
# │ `root` is a path on the OTHER machine, so ~ expands against ITS home.
# │ `port` and `identity_file` are optional — they are the only two things ssh
# │ cannot carry in the destination string.
# │
# │ KEEP THIS BLOCK LAST. A [[table]] header captures every key after it, so a
# │ [[remote]] placed higher up swallows editor, file_manager, async_apps...
# └──────────────────────────────────────────────────────────────────────────┘
# [[remote]]
# name = "agent"
# host = "you@1.2.3.4"
# port = 2222
# identity_file = "~/.ssh/agent_key"
# root = "~/shara"
